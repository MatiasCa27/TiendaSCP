<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="../estilos/estilos.css">
    <link rel="stylesheet" href="../estilos/boxes.css">
</head>
<body>
    <div class="contenedor-columna">
        <div class="logo-box">
            <img src="../imagenes/CI-logo.webp" alt="logo" width="250" height="250">
        </div>
        <p>
            Alias
        </p>
            <div class="box input-box">
                <input type="text" id="register-alias">
            </div>
        <p>
            Correo electronico
        </p>
            <div class="box input-box">
                <input type="email" id="register-correo">
            </div>
        <p>
            Claves de acceso
        </p>
            <div class="box input-box">
                <input type="password" id="register-password">
            </div>

        <div class="box boton-box1">
            <button type="button" onclick="registrarse()">Crear cuenta</button>
        </div>
    </div>
    <script src="../metodos/metodos.js"></script>
</body>
</html>
